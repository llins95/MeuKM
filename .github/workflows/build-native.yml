name: Build Android e Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/meukm_flutter/**"
      - ".github/workflows/build-native.yml"
  push:
    branches: [main]
    paths:
      - "apps/meukm_flutter/**"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meukm_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Validar assinatura Android obrigatória
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não configurado. Builds Android de produção exigem assinatura persistente."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Todos os secrets de assinatura Android estão configurados."
      - name: Restaurar assinatura Android persistente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/meukm-release.jks
          test -s android/app/meukm-release.jks
          echo "Assinatura persistente do Android restaurada."
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/meukm_flutter/android/app/meukm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Verificar assinatura do APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Preparar APK e checksum
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/MeuKM.apk
          cd build/release
          sha256sum MeuKM.apk > MeuKM.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MeuKM-Android
          path: |
            apps/meukm_flutter/build/release/MeuKM.apk
            apps/meukm_flutter/build/release/MeuKM.apk.sha256

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/meukm_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Compactar aplicativo e criar checksum
        shell: pwsh
        run: |
          $releaseDirectory = "build/windows/x64/runner/Release"
          $archive = "build/MeuKM-Windows-x64.zip"
          Compress-Archive -Path "$releaseDirectory/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  MeuKM-Windows-x64.zip" | Set-Content "build/MeuKM-Windows-x64.zip.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: MeuKM-Windows
          path: |
            apps/meukm_flutter/build/MeuKM-Windows-x64.zip
            apps/meukm_flutter/build/MeuKM-Windows-x64.zip.sha256

  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Ler versão
        id: version
        run: |
          version="$(awk '/^version:/ {print $2}' apps/meukm_flutter/pubspec.yaml)"
          version_name="${version%%+*}"
          version_code="${version##*+}"
          echo "tag=v${version_name}+${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
      - name: Publicar release para atualização automática
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release $RELEASE_TAG já existe; mantendo a versão publicada."
            exit 0
          fi
          cat > release-notes.md <<EOF
          MeuKM $VERSION_NAME ($VERSION_CODE)

          - Primeira versão Android assinada com a chave permanente do MeuKM.
          - O pipeline agora bloqueia publicações Android sem assinatura persistente.
          - O APK passa por verificação de assinatura antes de ser publicado.
          - Mantém as correções de cálculo automático dos litros e validação do odômetro.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/MeuKM.apk \
            dist/MeuKM.apk.sha256 \
            dist/MeuKM-Windows-x64.zip \
            dist/MeuKM-Windows-x64.zip.sha256 \
            --title "MeuKM $VERSION_NAME" \
            --notes-file release-notes.md \
            --latest
