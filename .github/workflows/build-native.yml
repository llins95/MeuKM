name: Build Android e Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/meukm_flutter/**"
      - ".github/workflows/build-native.yml"
  push:
    branches: [main]
    paths:
      - "apps/meukm_flutter/**"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meukm_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restaurar assinatura Android quando configurada
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/meukm-release.jks
            echo "Assinatura persistente do Android restaurada."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 não configurado; esta validação usará a chave de debug. Configure os quatro secrets de assinatura antes de depender de atualizações Android entre releases."
          fi
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/meukm_flutter/android/app/meukm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Preparar APK e checksum
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/MeuKM.apk
          cd build/release
          sha256sum MeuKM.apk > MeuKM.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MeuKM-Android
          path: |
            apps/meukm_flutter/build/release/MeuKM.apk
            apps/meukm_flutter/build/release/MeuKM.apk.sha256

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/meukm_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Compactar aplicativo e criar checksum
        shell: pwsh
        run: |
          $releaseDirectory = "build/windows/x64/runner/Release"
          $archive = "build/MeuKM-Windows-x64.zip"
          Compress-Archive -Path "$releaseDirectory/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  MeuKM-Windows-x64.zip" | Set-Content "build/MeuKM-Windows-x64.zip.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: MeuKM-Windows
          path: |
            apps/meukm_flutter/build/MeuKM-Windows-x64.zip
            apps/meukm_flutter/build/MeuKM-Windows-x64.zip.sha256

  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Ler versão
        id: version
        run: |
          version="$(awk '/^version:/ {print $2}' apps/meukm_flutter/pubspec.yaml)"
          version_name="${version%%+*}"
          version_code="${version##*+}"
          echo "tag=v${version_name}+${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
      - name: Publicar release para atualização automática
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release $RELEASE_TAG já existe; mantendo a versão publicada."
            exit 0
          fi
          cat > release-notes.md <<EOF
          MeuKM $VERSION_NAME ($VERSION_CODE)

          - Nova área Configuração de conta, reunindo e-mail, sincronização e sair da conta.
          - Atualização automática no Android e Windows.
          - Downloads validados com SHA-256.
          - No Windows, o atualizador aguarda o app fechar, cria backup, substitui os arquivos e restaura a versão anterior se houver falha.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/MeuKM.apk \
            dist/MeuKM.apk.sha256 \
            dist/MeuKM-Windows-x64.zip \
            dist/MeuKM-Windows-x64.zip.sha256 \
            --title "MeuKM $VERSION_NAME" \
            --notes-file release-notes.md \
            --latest
